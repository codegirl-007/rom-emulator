[package]
name = "rom-emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.8.0"
env_logger = "0.11.6"
futures = "0.3.31"
lazy_static = "1.5.0"
log = "0.4.25"
rand = "0.8.5"
sdl2 = "0.37.0"
serde = "1.0.217"
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = ["full"] }
